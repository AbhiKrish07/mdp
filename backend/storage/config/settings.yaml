# AI Desk Companion - System Settings Configuration

system:
  device_name: "AI-Desk-Companion-v1"
  log_level: "INFO"
  privacy_mode_default: false
  database_path: "ai_companion_session.db"

perception:
  wake_word: "hey companion"
  wake_word_sensitivity: 0.7
  stt_engine: "whisper_local" # options: whisper_local, web_stt, mock
  face_detection_confidence: 0.6
  motion_detection_sensitivity: 0.5
  camera_fps: 30

reasoning:
  provider: "groq" # options: groq, openai, mock
  groq_model: "llama-3.3-70b-versatile"
  groq_vision_model: "llama-3.2-11b-vision-preview"
  temperature: 0.7
  max_tokens: 500
  sit_threshold_minutes: 90
  sit_check_interval_seconds: 60

action:
  tts_engine: "piper" # options: piper, gtts, web_speech, mock
  voice_speed: 1.0
  gesture_cooldown_seconds: 3.0
  movement_max_speed: 0.6 # normalized 0-1 scale

storage:
  auto_vacuum: true
  retention_days: 30
